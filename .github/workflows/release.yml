name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 PySide6-Fluent-Widgets imageio-ffmpeg pyinstaller pytest

      - name: Run tests
        run: |
          python -m pytest tests -q

      - name: Build exe
        run: |
          pyinstaller --onefile --windowed --name TangdouDownloader `
            --icon assets/icon.ico `
            --version-file scripts/version_info.txt `
            --collect-all imageio_ffmpeg `
            --collect-all PySide6.QtMultimedia `
            --collect-all PySide6.QtMultimediaWidgets `
            --add-data "assets;assets" `
            --noconfirm tangdou_gui.py

      - name: Verify exe
        run: |
          Get-Item dist/TangdouDownloader.exe | Select-Object Name, Length

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TangdouDownloader.exe
          generate_release_notes: true
